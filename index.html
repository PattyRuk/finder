<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="description" content="API's Final Project">
    <link rel="icon" href="./assets/media/briefcase-solid.png" type="image/x-icon" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/styles/index.css"/>
    <title>Job Finder</title>
    <script type="module" src="./assets/script/index.js"></script>

</head>
<body>
   <main class="container">
    <section class="left">
        <div class="left-content">
            <i class="fa-solid fa-briefcase icon"></i>
            <h1>Job Finder</h1>
            <p>
                Connect with professionals and discover job opportunities.
            </p>
        </div>
    </section>
    <section class="right">
        <div class="login box">
            <h2>Welcome</h2>
            <p class="subtitle">Login to your account</p>
            <form>
                <div class="user-input">
                    <i class="fa-regular fa-user"></i>
                    <input type="email or username" placeholder="Email or Username">
                </div>
                <div class="user-input">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Password">
                </div>
                <p class="forgot">Forgot password</p>
                <button class="login-btn">Login</button>
                <button class="signup-btn">Sign Up</button>
            </form>
        </div>
    </section>

   </main>
</body>
</html>
